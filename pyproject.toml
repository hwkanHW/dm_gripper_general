[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daimon-control"
version = "0.1.0"
description = "Daimon gripper, camera, and tactile control applications"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "dm-lingkong-grip-sdk>=1.0.0",
  "grpcio>=1.75.1",
  "protobuf>=6.32.1",
  "numpy>=1.20",
  "opencv-contrib-python>=4.6.0.66,<=4.11.0.84",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "requests>=2.31",
  "websocket-client>=1.6",
  "websockets>=12.0",
]

[project.optional-dependencies]
tactile = ["dmrobotics"]

[project.scripts]
daimon-server = "daimon_control.server.app:main"
daimon-gripper-gui = "daimon_control.clients.gripper_gui:main"
daimon-image-viewer = "daimon_control.clients.image_viewer:main"
daimon-dashboard-single = "daimon_control.dashboards.single:main"
daimon-dashboard-dual = "daimon_control.dashboards.dual:main"

[tool.setuptools]
include-package-data = false
packages = [
  "daimon_control", "daimon_control.server", "daimon_control.clients",
  "daimon_control.dashboards", "dm_gripper_cam_py", "dm_gripper_tac_py",
]
package-dir = {"" = "src", "dm_gripper_cam_py" = "sdks/dm_gripper_cam_py", "dm_gripper_tac_py" = "sdks/dm_gripper_tac_py"}

[tool.setuptools.package-data]
dm_gripper_cam_py = ["*.proto"]
